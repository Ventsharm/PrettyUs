<iframe name="hidden_target" id="hidden_target" title="Order submission" style="position:absolute;width:1px;height:1px;border:0;clip-path:inset(50%);overflow:hidden"></iframe>
<form action="https://script.google.com/macros/s/AKfycbxpD6Ng4T93vAHBYvOy20m9PYrz-EORGBLktntFOASeHdypmNvVeOyNb84QEpJz8SZivw/exec" method="POST" target="hidden_target" id="avonForm" novalidate style="display:flex;flex-direction:column;gap:12px;background:transparent;border:none;box-shadow:none">

<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8045cd"><meta name="description" content="PrettyUs independent Avon representative: shopping, local orders, guidance and information.">
<title>Submit Avon Order | PrettyUs</title>
<link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">PrettyUs 💜</a><p>Your independent Avon beauty space</p></header>
<nav class="site-nav" aria-label="Main navigation"><div class="nav-scroll"><a href="index.html">Home</a><a href="submit-avon-order.html" aria-current="page">Order form</a><a href="my-avon-journey.html">My Avon journey</a><a href="building-your-avon-business.html">Business guide</a><a href="avon-representative-guide.html">Rep guide</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="prettyus-rules.html">Rules</a></div></nav>
<main class="container"><div class="page-heading"><h1>Submit Avon Order</h1></div><div class="page-content">
<div id="formContainer" style="max-width:560px;margin:16px auto;padding:22px;background:#fff;border-radius:22px;border:1px solid #e7daf5;box-shadow:0 6px 24px #52316c18;">
<h2 style="margin:0 0 8px">Submit Avon Order</h2>
<p style="margin:0 0 12px;color:#555">Complete this form only if you live in Hailsham or Hellingly.</p>
<iframe name="hidden_target" id="hidden_target" title="Order submission" style="position:absolute;width:1px;height:1px;border:0;clip-path:inset(50%);overflow:hidden"></iframe>
<form action="https://script.google.com/macros/s/AKfycbzaQI2Xby6pVMBVYLBfOYeBKV7tnODqvv9w4mBU7A-Orus4zkE_CjytX7CKBMVJAln6/exec" method="POST" target="hidden_target" id="avonForm" novalidate style="display:flex;flex-direction:column;gap:12px;background:transparent;border:none;box-shadow:none">
<input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
<input name="FullName" type="text" placeholder="Your Full Name" aria-label="Your Full Name" required autocomplete="name" style="padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px">
<input name="Email" type="email" placeholder="Your Email" aria-label="Your Email" required autocomplete="email" inputmode="email" style="padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px">
<input name="Street" type="text" placeholder="Street Address" aria-label="Street Address" required autocomplete="address-line1" style="padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px">
<input name="Town" type="text" placeholder="Town" aria-label="Town" required autocomplete="address-level2" style="padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px">
<input name="Postcode" type="text" placeholder="Postcode" aria-label="Postcode" required autocomplete="postal-code" style="padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px">
<textarea name="AvonItems" placeholder="List your Avon items" aria-label="List your Avon items" required style="min-height:140px;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit;resize:vertical"></textarea>
<div role="status" aria-live="polite" id="orderStatus" style="color:#5e397e;font-size:14px"></div>
<button id="submitBtn" type="submit" style="padding:14px 16px;background:#6732a8;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer">Submit</button>
</form>
</div>
<script>
(function(){
 var form=document.getElementById('avonForm'), iframe=document.getElementById('hidden_target'),status=document.getElementById('orderStatus'),btn=document.getElementById('submitBtn');
 var sent=false,finished=false,timeout;
 form.addEventListener('submit',function(e){
  if(sent){e.preventDefault();return}
  var fields=form.querySelectorAll('input[required],textarea[required]');
  for(var i=0;i<fields.length;i++){
   var field=fields[i];
   if(!field.value.trim() || !field.checkValidity()){
    e.preventDefault();status.textContent='Please fill in all fields correctly before submitting.';field.focus();return;
   }
  }
  if(form.elements.website.value){e.preventDefault();status.textContent='Thank you.';return}
  sent=true;btn.disabled=true;btn.textContent='Sending…';status.textContent='Sending your order…';
  timeout=setTimeout(function(){if(!finished){status.textContent='We could not confirm delivery. Please contact PrettyUs before resubmitting your order.';btn.textContent='Submission status unknown';}},15000);
 });
 iframe.addEventListener('load',function(){
  if(!sent || finished)return;
  finished=true;clearTimeout(timeout);
  status.textContent='Your form was sent for processing. Please contact PrettyUs if you do not receive a reply; delivery cannot be verified by this page.';
  btn.textContent='Form sent';
 });
})();
</script>
</div></main>

</body></html>
